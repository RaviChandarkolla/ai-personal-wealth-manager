repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: poetry run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: poetry run pytest -q
        language: system
        pass_filenames: false
        types: [python]
