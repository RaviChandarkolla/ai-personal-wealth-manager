[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "wealth-advisor"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "yfinance>=0.2",
    "python-dotenv",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[project.optional-dependencies]
llm = ["langchain", "langchain-openai", "langchain-anthropic", "langfuse"]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "pre-commit"]

[project.scripts]
wealth-advisor = "wealth_advisor.cli:main"

[tool.poetry]
packages = [{ include = "wealth_advisor", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
